version: "3.8"

services:
  postgres:
    image: postgres:15
    container_name: skin_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: syifai_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  n8n:
    image: n8nio/n8n
    container_name: n8n_workflow
    restart: always
    ports:
      - "5678:5678"
    environment:
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_DATABASE=syifai_db
      - DB_POSTGRESDB_USER=postgres
      - DB_POSTGRESDB_PASSWORD=123456
      
      # 🟢 SETTINGAN AMAN & VALID:
      - WEBHOOK_URL=https://widely-acapnial-aliza.ngrok-free.dev/
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - NODE_ENV=production
      - N8N_CORS_ALLOWED_ORIGINS=http://localhost:3000
      - N8N_RUNNERS_ENABLED=true
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
      - N8N_GIT_NODE_DISABLE_BARE_REPOS=true
      - N8N_ENCRYPTION_KEY=t8Wu8k1GDYIUigTh+eV7Z6d+nmnaiV1A
    depends_on:
      - postgres

volumes:
  postgres_data: